<!DOCTYPE html>
<html>
<head>
    <title>Manager Dashboard</title>
</head>
<body>

<h2>Manager Dashboard</h2>

<p>Welcome, {{ session.username }}</p>

<a href="/logout">Logout</a>

<hr>
<h2>Dashboard</h2>
<p>📌 Pending Leads: <b>{{ stats[0] }}</b></p>
<p>✅ Completed Leads: <b>{{ stats[1] }}</b></p>
<hr>

<h3>Create Caller</h3>
<form method="post" action="/create_caller">
    <input name="username" placeholder="Caller name" required>
    <input name="password" placeholder="Password" required>
    <button type="submit">Create Caller</button>
</form>
<hr>

<h2>Add Lead</h2>

<form method="POST" action="/add_lead">
  <input name="name" placeholder="Customer Name" required>
  <input name="phone" placeholder="Phone Number" required>

  <select name="assigned_to" required>
    <option value="">Assign to caller</option>
    {% for c in callers %}
      <option value="{{ c[0] }}">{{ c[0] }}</option>
    {% endfor %}
  </select>

  <button type="submit">Add Lead</button>
</form>

<hr>

<h2>All Leads</h2>
<table border="1">
<tr>
  <th>Name</th>
  <th>Phone</th>
  <th>Caller</th>
  <th>Status</th>
</tr>
{% for l in leads %}
<tr>
  <td>{{ l[1] }}</td>
  <td>{{ l[2] }}</td>
  <td>{{ l[3] }}</td>
  <td>{{ l[4] }}</td>
</tr>
{% endfor %}
</table>

</body>
</html>
