<!DOCTYPE html>
<html>
<head>
  <title>Manager Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="navbar">
  Manager Dashboard
  <a href="/logout" style="float:right;">Logout</a>
</div>

<div class="container">

  <!-- STATS -->
  <div class="stats">
    <div class="stat-box">
      <h3>{{ stats[0] }}</h3>
      <p>Pending Leads</p>
    </div>
    <div class="stat-box">
      <h3>{{ stats[1] }}</h3>
      <p>Completed Leads</p>
    </div>
  </div>

  <!-- CREATE CALLER -->
  <div class="card">
    <h3>Create Caller</h3>
    <form method="POST" action="/create_caller">
      <input name="username" placeholder="Caller Username" required>
      <input name="password" type="password" placeholder="Password" required>
      <button>Create Caller</button>
    </form>
  </div>

  <!-- LEADS TABLE -->
  <div class="card">
    <h3>All Leads</h3>
    <table border="1" width="100%">
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Caller</th>
        <th>Status</th>
      </tr>

      {% for l in leads %}
      <tr>
        <td>{{ l[0] }}</td>
        <td>{{ l[1] }}</td>
        <td>{{ l[2] or "—" }}</td>
        <td>{{ l[3] }}</td>
      </tr>
      {% else %}
      <tr>
        <td colspan="4">No leads found</td>
      </tr>
      {% endfor %}
    </table>
  </div>

</div>

</body>
</html>
