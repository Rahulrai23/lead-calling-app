<body>

<a href="/logout">Logout</a>
<hr>

<h2>My Assigned Leads</h2>
<!-- caller leads table -->

{% if leads %}
<table border="1">
  <tr>
    <th>Name</th>
    <th>Phone</th>
    <th>Action</th>
  </tr>

  {% for lead in leads %}
  <tr>
    <td>{{ lead[1] }}</td>
    <td>
      <a href="tel:{{ lead[2] }}">Call</a>
    </td>
    <td>
      <!-- remarks form -->
    </td>
  </tr>
  {% endfor %}
</table>
{% else %}
<p><b>No pending leads assigned to you.</b></p>
{% endif %}
