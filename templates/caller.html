<!DOCTYPE html>
<html>
<head>
  <title>Caller Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="navbar">
  Caller Dashboard
  <a href="/logout" style="float:right;">Logout</a>
</div>

<div class="container">

  {% for lead in leads %}
  <div class="card">
    <p><b>Name:</b> {{ lead[1] }}</p>
    <p><b>Phone:</b> <a href="tel:{{ lead[2] }}">{{ lead[2] }}</a></p>

    <form method="POST" action="/start_call/{{ lead[0] }}">
      <button class="primary">📞 Start Call</button>
    </form>

    <form method="POST" action="/submit">
      <input type="hidden" name="lead_id" value="{{ lead[0] }}">
      <input type="hidden" name="caller_name" value="{{ caller_name }}">
      <textarea name="remarks" placeholder="Call remarks" required></textarea>
      <button class="success">Submit</button>
    </form>
  </div>
  {% else %}
    <p>No pending leads 🎉</p>
  {% endfor %}

</div>
</body>
</html>
