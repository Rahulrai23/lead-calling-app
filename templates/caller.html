<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caller Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="navbar">
  Caller Dashboard
  <a href="/logout" style="float:right;">Logout</a>
</div>

<div class="container">

{% for lead in leads %}
<div class="card">
  <p><b>Name:</b> {{ lead[1] }}</p>
  <p><b>Phone:</b> <a href="tel:{{ lead[2] }}">{{ lead[2] }}</a></p>

  <!-- START CALL -->
  <button onclick="startCall({{ lead[0] }}, this)">
    📞 Start Call
  </button>

  <!-- SUBMIT FORM -->
  <form method="POST" action="/submit">
    <input type="hidden" name="lead_id" value="{{ lead[0] }}">
    <input type="hidden" name="caller_name" value="{{ caller_name }}">

    <textarea name="remarks"
      placeholder="Call remarks"
      disabled
      required></textarea>

    <button type="submit" disabled>
      Submit
    </button>
  </form>
</div>
{% else %}
<p>No pending leads 🎉</p>
{% endfor %}

</div>

<script>
function startCall(leadId, btn) {
  fetch(`/start_call/${leadId}`, { method: "POST" })
    .then(res => res.json())
    .then(() => {
      const card = btn.closest(".card");
      card.querySelector("textarea").disabled = false;
      card.querySelector("button[type='submit']").disabled = false;
      btn.disabled = true;
      btn.innerText = "📞 Call Started";
    });
}
</script>

</body>
</html>
